<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pedidos &middot; General Distribution</title>
<link rel="icon" href="logo-gd.png">
<link rel="apple-touch-icon" href="logo-gd.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos GD">
<meta name="theme-color" content="#1f2937">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:#f4f5f7;color:#16191d;font-size:15px;padding-bottom:78px}
header{background:#1f2937;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:50;
       box-shadow:0 1px 6px rgba(0,0,0,.25)}
.hd{display:table;width:100%}
.hd .lg{display:table-cell;width:46px;vertical-align:middle}
.hd .lg img{width:42px;height:42px;display:block;border-radius:50%}
.hd .tx{display:table-cell;vertical-align:middle;padding-left:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;line-height:1.15}
.hd .yo{display:table-cell;vertical-align:middle;text-align:right;width:86px}
.bent{background:transparent;border:1px solid rgba(255,255,255,.38);color:#fff;
      border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.bent.dentro{border-color:#34d399;color:#34d399}
.cajaent{background:#fff;border-radius:10px;padding:13px;margin-top:9px;display:none}
.cajaent input{width:100%;padding:11px;font-size:16px;border:1px solid #d5d9df;
               border-radius:8px;margin-bottom:8px;color:#16191d}
.cajaent button{width:100%;padding:12px;border:0;border-radius:8px;background:#1f2937;
                color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.cajaent .av{font-size:12.5px;color:#991b1b;margin-bottom:8px;display:none}
.cajaent .ex{font-size:12px;color:#6b7280;margin:0 0 9px;line-height:1.35}
.pista{background:#eef2ff;color:#3730a3;padding:9px 13px;font-size:12.5px;
       border-bottom:1px solid #c7d2fe;display:none;line-height:1.35}
.sub{opacity:.6;font-weight:400;font-size:12.5px}
.tienda{margin-top:8px;display:block;width:100%;padding:11px 12px;border:0;border-radius:8px;
        font-size:16px;background:#fff;color:#16191d}
.sug{position:relative;z-index:30}
.sugl{position:absolute;left:0;right:0;top:2px;background:#fff;border-radius:10px;
      box-shadow:0 8px 24px rgba(16,24,40,.22);overflow:hidden;max-height:290px;overflow-y:auto}
.sugi{padding:12px 13px;border-bottom:1px solid #eceef1;color:#16191d;font-size:15px;cursor:pointer}
.sugi:last-child{border-bottom:0}
.sugi b{display:block;font-weight:700}
.sugi span{color:#6b7280;font-size:12.5px}
.sugi:active{background:#f4f5f7}
.cambiar{background:transparent;border:0;color:#fff;opacity:.75;font-size:12px;
         text-decoration:underline;padding:4px 0 0;cursor:pointer}
.tienda::placeholder{color:#9aa1ab}
.tienda.fija{font-weight:700;background:#eef0f3}
.dsd{margin-top:5px;font-size:12px;opacity:.75}
.tools{background:#fff;padding:9px 12px;border-bottom:1px solid #e3e6ea;position:sticky;top:0;z-index:40}
#q{width:100%;padding:11px 12px;font-size:16px;border:1px solid #d5d9df;border-radius:8px;background:#f8f9fa}
.qrow{display:flex;gap:7px}
.vr{display:flex;gap:7px;margin-top:7px}
.vr select,.vr input{flex:1;min-width:0;padding:10px 11px;font-size:15px;border:0;border-radius:8px;background:#fff;color:#111}
.vr .falta{outline:2px solid #f59e0b}
.qrow #q{flex:1;min-width:0;width:auto}
#bCam{flex:none;width:50px;border:0;border-radius:8px;background:#1f2937;color:#fff;font-size:21px;line-height:1}
.cam{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,.92);
  padding:16px;text-align:center;color:#fff}
.cam.on{display:block}
#camVista{width:100%;max-width:520px;margin:10px auto 0;border-radius:10px;overflow:hidden;background:#000;min-height:220px}
#camMsg{margin:14px 0;font-size:17px;font-weight:700}
#camCerrar{padding:13px 26px;font-size:17px;border:0;border-radius:9px;background:#fff;color:#111;font-weight:700}
.chips{display:block;white-space:nowrap;overflow-x:auto;margin-top:9px;padding-bottom:2px}
.chip{display:inline-block;padding:7px 13px;margin-right:6px;border-radius:999px;background:#eef0f3;
      color:#48505a;font-size:13px;font-weight:600;border:0}
.chip.on{background:#1f2937;color:#fff}
.count{padding:9px 13px;color:#6b7280;font-size:13px}
.count .act{float:right;color:#1f2937;font-weight:700;text-decoration:underline;cursor:pointer}
.count .act:active{opacity:.5}
.grid{padding:0 8px}
.card{background:#fff;border-radius:10px;margin-bottom:8px;padding:9px;display:table;width:100%;
      box-shadow:0 1px 2px rgba(16,24,40,.07)}
.cell{display:table-cell;vertical-align:middle}
.ph{width:68px}
.ph img{width:60px;height:60px;object-fit:contain;border-radius:6px;background:#f4f5f7;display:block}
.noimg{width:60px;height:60px;border-radius:6px;background:#eef0f3;display:block;text-align:center;line-height:60px;font-size:24px;font-weight:700;color:#aeb4bc}
.info{padding:0 8px}
.name{font-weight:600;line-height:1.25;font-size:14px}
.meta{color:#6b7280;font-size:12px;margin-top:3px}
.price{font-weight:700;color:#0f7b3f;font-size:15px;margin-top:3px}
.price.suyo{color:#6d28d9}
.suyoTag{display:inline-block;font-size:9.5px;font-weight:700;color:#6d28d9;
         background:#f3e8ff;border-radius:999px;padding:1px 6px;margin-left:5px;
         vertical-align:middle}
.lapiz{border:0;background:transparent;font-size:14px;padding:0 0 0 6px;
       cursor:pointer;vertical-align:middle;opacity:.6}
.pedit{width:76px;padding:5px 6px;font-size:15px;font-weight:700;text-align:right;
       border:2px solid #6d28d9;border-radius:6px;color:#6d28d9}
.deja{font-size:10px;color:#8b929c;display:block;margin-top:1px}
.nop{font-weight:600;color:#b45309;font-size:12px;margin-top:3px}
.agot{color:#b91c1c;font-size:11px;font-weight:700}
.stp{width:104px;text-align:right;white-space:nowrap}
.b{width:32px;height:32px;border-radius:8px;border:1px solid #d5d9df;background:#fff;
   font-size:19px;font-weight:700;color:#1f2937;line-height:1;padding:0;vertical-align:middle}
.b:active{background:#eef0f3}
.b.add{background:#1f2937;color:#fff;border-color:#1f2937}
.qty{display:inline-block;width:34px;text-align:center;font-weight:700;font-size:16px;vertical-align:middle}
.card.sel{box-shadow:0 0 0 2px #1f2937}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1f2937;color:#fff;padding:11px 13px;z-index:60;
     display:table;width:100%}
.bar.hide{display:none}
.bar .l{display:table-cell;vertical-align:middle}
.bar .r{display:table-cell;vertical-align:middle;text-align:right;width:120px}
.bar b{font-size:17px}
.bar small{display:block;opacity:.72;font-size:12px}
.go{background:#22c55e;color:#04240f;border:0;border-radius:8px;padding:11px 15px;font-weight:700;font-size:15px}
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;background:#fff;z-index:100;overflow-y:auto;display:none}
.sheet.on{display:block}
.sh{background:#1f2937;color:#fff;padding:12px 13px;position:sticky;top:0;display:table;width:100%}
.sh .l{display:table-cell;font-weight:700;font-size:17px;vertical-align:middle}
.sh .r{display:table-cell;text-align:right;width:70px;vertical-align:middle}
.x{background:transparent;border:0;color:#fff;font-size:26px;line-height:1;padding:0 4px}
.ln{padding:10px 13px;border-bottom:1px solid #eceef1;display:table;width:100%}
.ln .a{display:table-cell;vertical-align:middle}
.ln .b2{display:table-cell;vertical-align:middle;width:112px;text-align:right;white-space:nowrap}
.tot{padding:14px 13px;font-size:19px;font-weight:700;display:table;width:100%}
.tot .r{display:table-cell;text-align:right}
.acts{padding:0 13px 22px}
.big{display:block;width:100%;padding:15px;border:0;border-radius:10px;font-size:16px;font-weight:700;margin-bottom:9px}
.wa{background:#22c55e;color:#04240f}
.cp{background:#eef0f3;color:#1f2937}
.cl{background:#fff;color:#b91c1c;border:1px solid #f0c8c8}
.dest{text-align:center;color:#6b7280;font-size:12.5px;margin:-3px 0 11px}
.ok{background:#dcfce7;color:#065f2b;padding:12px 13px;border-radius:9px;font-weight:600;margin-bottom:11px;display:none;line-height:1.35}
.nuevo{background:#1f2937;color:#fff;display:none}
.pend{background:#fef3c7;color:#7c4a03;padding:9px 13px;font-size:13px;border-bottom:1px solid #fde68a;display:none;line-height:1.35}
.note{width:100%;padding:11px;border:1px solid #d5d9df;border-radius:8px;font-size:15px;
      font-family:inherit;margin-bottom:11px}
.empty{padding:44px 20px;text-align:center;color:#8b929c}
.tip{padding:10px 13px;color:#6b7280;font-size:12.5px;background:#fffbeb;border-bottom:1px solid #fde68a}
</style>
</head>

/* JS a la antigua a proposito: tiene que correr en telefonos viejos. */
/* A DONDE SE VAN LAS ORDENES. Para cambiarlo, cambia solo esta linea.
   Formato: clave de pais + numero, sin +, sin espacios y sin guiones.
   1 = Estados Unidos. Ejemplo: 18015551234 */
var WHATSAPP = '18018986304';

/* ---- La base de datos. Llave PUBLICA: solo permite ESCRIBIR pedidos, nunca leerlos. ---- */
var SB_URL = 'https://ounctklerzpwtmcftuvf.supabase.co/rest/v1';
var SB_KEY = 'sb_publishable_0p52bWzvqzS87hCn_01xNw_sjm8N8wu';

/* uuid v4 hecho a mano: crypto.randomUUID no existe en telefonos viejos */
function uuid(){
  var h = '0123456789abcdef', s = '', i;
  for(i=0;i<36;i++){
    if(i===8||i===13||i===18||i===23) s += '-';
    else if(i===14) s += '4';
    else if(i===19) s += h.charAt(Math.floor(Math.random()*4)+8);
    else s += h.charAt(Math.floor(Math.random()*16));
  }
  return s;
}

/* 409 = ya existia. Como el id lo generamos nosotros, reintentar es seguro:
   si el pedido ya se habia subido, la base lo rechaza por repetido y eso ES exito. */
function post(tabla, cuerpo, ok, falla){
  var x = new XMLHttpRequest();
  x.open('POST', SB_URL + '/' + tabla, true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
  x.setRequestHeader('Content-Type', 'application/json');
  x.setRequestHeader('Prefer', 'return=minimal');
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    if((x.status >= 200 && x.status < 300) || x.status === 409) ok(); else falla(x.status);
  };
  try { x.send(JSON.stringify(cuerpo)); } catch(e){ falla(0); }
}

function cola(){ try { return JSON.parse(localStorage.getItem('gd_cola') || '[]'); } catch(e){ return []; } }
function ponCola(c){ try { localStorage.setItem('gd_cola', JSON.stringify(c)); } catch(e){} }

function pintaPend(){
  var n = cola().length, el = document.getElementById('pend');
  if(n > 0){
    el.innerHTML = '<b>' + n + (n===1 ? ' pedido sin subir' : ' pedidos sin subir') + '.</b> ' +
      (n===1 ? 'Est&aacute; guardado en el tel&eacute;fono y se sube solo en cuanto haya se&ntilde;al.'
             : 'Est&aacute;n guardados en el tel&eacute;fono y se suben solos en cuanto haya se&ntilde;al.');
    el.style.display = 'block';
  } else { el.style.display = 'none'; }
}

function subirUno(ped, hecho){
  post('gd_pedidos',
    {id:ped.id, tienda:ped.tienda, tienda_id:(ped.tienda_id || null), nota:ped.nota,
     articulos:ped.articulos, total:ped.total, es_prueba:false,
     vendedor:(ped.vendedor || null), ruta:(ped.ruta || null)},
    function(){
      if(!ped.lineas || !ped.lineas.length){ hecho(true); return; }
      post('gd_pedido_lineas', ped.lineas, function(){ hecho(true); }, function(){ hecho(false); });
    },
    function(){ hecho(false); });
}

/* Sube de uno en uno. Si uno falla, se detiene y lo deja para despues. */
function vaciarCola(){
  var c = cola();
  if(!c.length){ pintaPend(); return; }
  subirUno(c[0], function(ok){
    if(ok){ var d = cola(); d.shift(); ponCola(d); pintaPend(); vaciarCola(); }
    else { pintaPend(); }
  });
}

function guardarPedido(){
  var pid = uuid(), lineas = [], tot = 0, n = 0, i;
  for(i=0;i<P.length;i++){
    var pr = P[i], c = cart[pr.i] || 0;
    if(c <= 0) continue;
    /* El pedido guarda lo que SE LE COBRA A ESTA TIENDA, no el precio general.
       De ahi sale despues "el precio que siempre le hemos dado". */
    var pu = precioDe(pr);
    n += c; tot += pu * c;
    lineas.push({id:uuid(), pedido_id:pid, producto_id:'' + pr.i, producto:pr.t,
                 categoria:pr.c, precio:pu, cantidad:c,
                 importe:Math.round(pu * c * 100) / 100});
  }
  var nt = document.getElementById('nota').value;
  var ped = {id:pid, tienda:document.getElementById('tienda').value, tienda_id:TIENDA_ID,
             nota:(nt ? nt : null), articulos:n, total:Math.round(tot*100)/100, lineas:lineas,
             vendedor:vrVal('vendedor'), ruta:vrVal('ruta')};
  var q = cola(); q.push(ped); ponCola(q);
  pintaPend(); vaciarCola();
}

/* Los avisos van DENTRO de la app: alert() y confirm() pueden estar bloqueados. */
function aviso(html){
  var el = document.getElementById('aviso');
  el.innerHTML = html; el.style.display = 'block';
}

var CATS = ["Dulces", "Abarrotes", "Bebidas", "Botanas", "Otros"];
var cart = {}, cat = '', q = '', shown = [];
var TIENDA_ID = null;   /* cuando el link trae ?t=codigo, el tendero ya no escribe nada */
/* El precio que le toca a ESTA tienda: {id del producto: precio}.
   Sale de gd_precios_de_la_tienda, que junta lo que se le puso a proposito
   y lo ultimo que de verdad se le cobro en un pedido anterior. */
var PRECIOS_TIENDA = {}, CODIGO_TIENDA = '';
/* El lapiz SOLO sale si en este telefono alguien entro al panel con su cuenta.
   El tendero abre el mismo link y no lo ve. */
function tokenDelEquipo(){
  try { return localStorage.getItem('gdp_tok') || ''; } catch(e){ return ''; }
}
function soyDelEquipo(){ return !!tokenDelEquipo(); }
function precioDe(p){
  var s = PRECIOS_TIENDA[p.i];
  return (s !== undefined && s !== null) ? Number(s) : Number(p.p || 0);
}
function esPrecioSuyo(p){
  var s = PRECIOS_TIENDA[p.i];
  return s !== undefined && s !== null && Number(s) !== Number(p.p || 0);
}

function param(n){
  var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}

/* El link de cada tienda la identifica sola. Antes se escribia a mano y ya
   habia pedidos con el nombre machucado que nadie supo de quien eran. */
/* ---------------------------------------------------------------
   EL CATALOGO VIVO
   El que viene dentro del archivo es la red de seguridad: sirve al
   instante y sin senal. En cuanto hay internet se trae el de la base,
   que es el que Manuel edita y el que trae los precios de QuickBooks.
   --------------------------------------------------------------- */
function guardaCatalogo(lista){
  try { localStorage.setItem('gd_cat', JSON.stringify(lista)); } catch(e){}
}
function catalogoGuardado(){
  try {
    var c = JSON.parse(localStorage.getItem('gd_cat') || 'null');
    return (c && c.length) ? c : null;
  } catch(e){ return null; }
}
function hayAlgoEnElCarrito(){
  for(var k in cart){ if(cart.hasOwnProperty(k) && cart[k] > 0) return true; }
  return false;
}
function ponCatalogo(lista){
  /* El catalogo SIEMPRE se actualiza. Si habia un pedido a medias, se conservan
     los renglones que siguen existiendo y se avisa de los que ya no.
     (Antes se bloqueaba el cambio, y eso dejaba el catalogo atorado para siempre.) */
  var vivos = {}, i, perdidos = 0;
  for(i=0;i<lista.length;i++) vivos[lista[i].i] = 1;
  for(var k in cart){
    if(cart.hasOwnProperty(k) && cart[k] > 0 && !vivos[k]){ delete cart[k]; perdidos++; }
  }
  if(perdidos > 0){
    save();
    var av = document.getElementById('dsd');
    if(av){
      av.innerHTML = '&#9888; Se quitaron ' + perdidos +
        (perdidos===1 ? ' producto del pedido porque ya no est&aacute;' : ' productos del pedido porque ya no est&aacute;n') +
        ' en el cat&aacute;logo.';
      av.style.display = 'block';
    }
  }
  P = lista;
  var c = {}, i;
  for(i=0;i<P.length;i++){ c[P[i].c] = (c[P[i].c] || 0) + 1; }
  var orden = [];
  for(var k in c){ if(c.hasOwnProperty(k)) orden.push([k, c[k]]); }
  orden.sort(function(a,b){ return b[1] - a[1]; });
  CATS = [];
  for(i=0;i<orden.length;i++) CATS.push(orden[i][0]);
  chips(); render(); paintBar();
}
/* La base no entrega mas de 1000 renglones de un jalon: se pide por tandas. */
function traeCatalogo(){
  var guardado = catalogoGuardado();
  if(guardado) ponCatalogo(guardado);
  var junta = [];
  function tanda(desde){
    var x = new XMLHttpRequest();
    x.open('GET', SB_URL + '/gd_catalogo?select=id,nombre,categoria,precio,foto,upc' +
                  '&order=nombre.asc&limit=1000&offset=' + desde, true);
    x.setRequestHeader('apikey', SB_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
    x.onreadystatechange = function(){
      if(x.readyState !== 4) return;
      if(x.status < 200 || x.status >= 300) return;
      var d = null;
      try { d = JSON.parse(x.responseText); } catch(e){ return; }
      if(!d) return;
      var i;
      for(i=0;i<d.length;i++){
        junta.push({ i:d[i].id, t:d[i].nombre, p:(d[i].precio || 0),
                     c:(d[i].categoria || 'Otros'), f:(d[i].foto || ''), d:1,
                     u:(d[i].upc || '') });
      }
      if(d.length === 1000){ tanda(desde + 1000); return; }   /* viene otra tanda */
      if(junta.length){ guardaCatalogo(junta); ponCatalogo(junta); }
    };
    try { x.send(null); } catch(e){}
  }
  tanda(0);
}

/* ---- entrar con la cuenta del equipo, desde aqui mismo ----
   Antes se dependia de haber entrado al panel. Si el panel esta como app
   en la pantalla de inicio y esto se abre en el navegador, el telefono no
   comparte la sesion y el lapiz no salia nunca. */
function guardaSesion(tok, ref){
  try {
    localStorage.setItem('gdp_tok', tok || '');
    if(ref) localStorage.setItem('gdp_ref', ref);
  } catch(e){}
}
function borraSesion(){
  try { localStorage.removeItem('gdp_tok'); localStorage.removeItem('gdp_ref'); } catch(e){}
}

function pintaQuienSoy(){
  var b = document.getElementById('bent');
  var p = document.getElementById('pista');
  if(!b) return;
  if(soyDelEquipo()){
    b.innerHTML = 'Salir';
    b.className = 'bent dentro';
    if(p){
      if(!TIENDA_ID){
        p.innerHTML = 'Ya entraste. <b>Escoge la tienda</b> arriba y aparece el &#9998; ' +
                      'para cambiarle los precios.';
        p.style.display = 'block';
      } else { p.style.display = 'none'; }
    }
  } else {
    b.innerHTML = 'Entrar';
    b.className = 'bent';
    if(p) p.style.display = 'none';
  }
}

function abreEntrar(){
  var c = document.getElementById('cajaent');
  c.style.display = (c.style.display === 'block') ? 'none' : 'block';
  if(c.style.display === 'block') document.getElementById('eCorreo').focus();
}

function haceEntrar(){
  var av = document.getElementById('aventrar');
  var co = document.getElementById('eCorreo').value.trim();
  var cl = document.getElementById('eClave').value;
  av.style.display = 'none';
  if(!co || !cl){
    av.innerHTML = 'Escribe tu correo y tu contrase&ntilde;a.';
    av.style.display = 'block'; return;
  }
  var b = document.getElementById('bhacer');
  b.disabled = true; b.innerHTML = 'Entrando&hellip;';
  var x = new XMLHttpRequest();
  x.open('POST', SB_URL.replace('/rest/v1','') + '/auth/v1/token?grant_type=password', true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    b.disabled = false; b.innerHTML = 'Entrar';
    var d = null;
    try { d = JSON.parse(x.responseText); } catch(e){}
    if(x.status >= 200 && x.status < 300 && d && d.access_token){
      guardaSesion(d.access_token, d.refresh_token);
      document.getElementById('eClave').value = '';
      document.getElementById('cajaent').style.display = 'none';
      pintaQuienSoy();
      render();
    } else {
      av.innerHTML = 'No pude entrar. Revisa el correo y la contrase&ntilde;a.';
      av.style.display = 'block';
    }
  };
  try { x.send(JSON.stringify({email: co, password: cl})); }
  catch(e){ b.disabled = false; b.innerHTML = 'Entrar'; }
}

function salirDeAqui(){
  borraSesion();
  pintaQuienSoy();
  render();
}

/* ---- escoger la tienda escribiendo el nombre ----
   Es el camino que usa Manuel vendiendo: abre la app general, escribe
   "Don Juan", la escoge, y a partir de ahi el pedido va amarrado a esa
   tienda y salen SUS precios. Igual que si hubiera abierto su link. */
var BUSCA_T = null, TIENDAS_VISTAS = {};

function pintaSugerencias(lista){
  var c = document.getElementById('sugl');
  if(!lista || !lista.length){ c.style.display = 'none'; c.innerHTML = ''; return; }
  var h = '', i;
  for(i=0;i<lista.length;i++){
    var s = lista[i];
    TIENDAS_VISTAS[s.codigo] = s;
    h += '<div class="sugi" data-tc="' + s.codigo + '"><b>' + s.nombre + '</b>' +
         '<span>' + (s.ruta ? s.ruta : 'sin ruta') + '</span></div>';
  }
  c.innerHTML = h;
  c.style.display = 'block';
}

function buscaTiendas(txt){
  txt = (txt || '').trim();
  /* Buscar por nombre expone la lista de clientes: solo con sesion de equipo.
     El tendero no lo necesita, su link ya trae su tienda. */
  if(!soyDelEquipo()){ pintaSugerencias([]); return; }
  if(txt.length < 2){ pintaSugerencias([]); return; }
  var x = new XMLHttpRequest();
  var e = encodeURIComponent('%' + txt + '%');
  x.open('GET', SB_URL + '/gd_tiendas?select=id,codigo,nombre,ruta&activo=eq.true' +
                '&nombre=ilike.' + e + '&order=nombre.asc&limit=8', true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + tokenDelEquipo());
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    var d = null;
    try { d = JSON.parse(x.responseText); } catch(e2){}
    pintaSugerencias(d || []);
  };
  try { x.send(null); } catch(e3){}
}

/* Deja el pedido amarrado a esa tienda y trae sus precios. */
function eligeTienda(cod){
  var s = TIENDAS_VISTAS[cod];
  if(!s) return;
  var el = document.getElementById('tienda'), m = document.getElementById('dsd');
  TIENDA_ID = s.id;
  CODIGO_TIENDA = s.codigo;
  PRECIOS_TIENDA = {};
  el.value = s.nombre;
  el.readOnly = true;
  el.className = 'tienda fija';
  pintaSugerencias([]);
  m.innerHTML = '&#10003; Pedido para <b>' + s.nombre + '</b>' +
                (soyDelEquipo() ? '<button class="cambiar" id="cambiarT">cambiar de tienda</button>' : '');
  m.style.display = 'block';
  var b = document.getElementById('cambiarT');
  if(b) b.onclick = sueltaTienda;
  traePreciosDeLaTienda(s.codigo);
  render();
  pintaQuienSoy();
  save();
}

function sueltaTienda(){
  var el = document.getElementById('tienda'), m = document.getElementById('dsd');
  TIENDA_ID = null; CODIGO_TIENDA = ''; PRECIOS_TIENDA = {};
  try { localStorage.removeItem('gd_tienda_id'); localStorage.removeItem('gd_tienda_cod'); } catch(e){}
  el.readOnly = false;
  el.className = 'tienda';
  el.value = '';
  el.focus();
  m.style.display = 'none';
  render();
  pintaQuienSoy();
  save();
}

function traePreciosDeLaTienda(cod){
  var x = new XMLHttpRequest();
  x.open('POST', SB_URL + '/rpc/gd_precios_de_la_tienda', true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    var d = null;
    try { d = JSON.parse(x.responseText); } catch(e){}
    if(!d || !d.length) return;
    var i, hubo = 0;
    for(i=0;i<d.length;i++){
      if(d[i].producto_id && d[i].precio !== null){
        PRECIOS_TIENDA[d[i].producto_id] = Number(d[i].precio);
        hubo++;
      }
    }
    if(hubo){
      try { render(); paintBar(); } catch(e){}
      var m = document.getElementById('dsd');
      if(m){
        var nom = document.getElementById('tienda').value || 'esta tienda';
        m.innerHTML = '&#10003; Pedido para <b>' + nom + '</b> &middot; ' + hubo +
                      ' con su propio precio' +
                      (soyDelEquipo() ? '<button class="cambiar" id="cambiarT">cambiar de tienda</button>' : '');
        m.style.display = 'block';
        var bb = document.getElementById('cambiarT');
        if(bb) bb.onclick = sueltaTienda;
      }
    }
  };
  try { x.send(JSON.stringify({p_codigo: cod})); } catch(e){}
}

function abreEditor(id){
  var cont = document.getElementById('pz' + id);
  if(!cont) return;
  var p = null, i;
  for(i=0;i<P.length;i++){ if(String(P[i].i) === String(id)){ p = P[i]; break; } }
  if(!p) return;
  cont.innerHTML = '<input class="pedit" type="text" inputmode="decimal" id="pe' + id +
                   '" value="' + Number(precioDe(p)).toFixed(2) + '">' +
                   '<span class="deja">precio de esta tienda</span>';
  var inp = document.getElementById('pe' + id);
  inp.focus();
  try { inp.select(); } catch(e){}
  inp.onkeyup = function(ev){ if(ev.keyCode === 13) this.blur(); };
  inp.onblur  = function(){ guardaPrecioTienda(id, this.value); };
}

function guardaPrecioTienda(id, valor){
  var n = parseFloat(String(valor).replace(/[^0-9.,-]/g,'').replace(',','.'));
  if(isNaN(n) || n < 0 || !TIENDA_ID){ paintCard(id); return; }
  n = Math.round(n*100)/100;
  var x = new XMLHttpRequest();
  x.open('POST', SB_URL + '/gd_precio_tienda', true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + tokenDelEquipo());
  x.setRequestHeader('Content-Type', 'application/json');
  /* si esa tienda ya tenia precio para ese producto, lo reemplaza */
  x.setRequestHeader('Prefer', 'resolution=merge-duplicates');
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    var m = document.getElementById('dsd');
    if(x.status >= 200 && x.status < 300){
      PRECIOS_TIENDA[id] = n;
      paintCard(id); paintBar();
      if(m){ m.innerHTML = '&#10003; Guardado. La pr&oacute;xima vez que abras esta tienda, ' +
                           'ese producto ya le sale en ' + money(n) + '.';
             m.style.display = 'block'; }
    } else {

function norm(s){
  s = (s||'').toLowerCase();
  s = s.replace(/[\u00e1\u00e0\u00e4\u00e2]/g,'a').replace(/[\u00e9\u00e8\u00eb\u00ea]/g,'e')
       .replace(/[\u00ed\u00ec\u00ef\u00ee]/g,'i').replace(/[\u00f3\u00f2\u00f6\u00f4]/g,'o')
       .replace(/[\u00fa\u00f9\u00fc\u00fb]/g,'u').replace(/\u00f1/g,'n');
  return s;
}
/* Codigo de barras: el escaner escribe solo digitos. Se comparan sin ceros
   a la izquierda (UPC de 12 = EAN de 13 con un 0 adelante) y aceptando que
   el escaner mande o no el ultimo digito (el verificador). */
function soloCodigo(s){ return s.replace(/^0+/, ''); }
function pegaCodigo(u, c){
  if(!u) return false;
  u = soloCodigo(u.replace(/\D/g, ''));
  if(!u) return false;
  if(u === c || u.slice(0, -1) === c || c.slice(0, -1) === u) return true;
  return c.length >= 6 && u.indexOf(c) >= 0;
}
function render(){
  var nq = norm(q), out = [], i, p;
  var qc = q.replace(/\s/g, '');
  var esCodigo = /^\d{6,}$/.test(qc);
  if(esCodigo) qc = soloCodigo(qc);
  for(i=0;i<P.length;i++){
    p = P[i];
    if(esCodigo){                 /* por codigo se busca en todas las categorias */
      if(!pegaCodigo(p.u, qc) && norm(p.t).indexOf(nq) < 0) continue;
      out.push(p); continue;
    }
    if(cat && p.c !== cat) continue;
    if(nq && norm(p.t).indexOf(nq) < 0) continue;
    out.push(p);
  }
  shown = out;
  document.getElementById('count').innerHTML = out.length + (out.length===1 ? ' producto' : ' productos') + (cat ? ' en ' + cat : '') + '<span class="act" id="refrescar">Actualizar</span>';
  var lim = Math.min(out.length, 200), h = '';
  for(i=0;i<lim;i++){
    p = out[i];
    var n = cart[p.i] || 0;
    h += '<div class="card' + (n>0?' sel':'') + '" id="c' + p.i + '">';
    h += '<div class="cell ph">' + (p.f ? '<img src="' + p.f + '" loading="lazy" alt="">' :
         '<span class="noimg">' + (p.t ? p.t.charAt(0).toUpperCase() : '?') + '</span>') + '</div>';
    h += '<div class="cell info"><div class="name">' + p.t + '</div>';
    h += '<div class="meta">' + p.c + (p.d ? '' : ' &middot; <span class="agot">AGOTADO</span>') + '</div>';
    var pre = precioDe(p), suyo = esPrecioSuyo(p);
    h += '<div id="pz' + p.i + '">';
    if(pre > 0){
      h += '<span class="price' + (suyo ? ' suyo' : '') + '">' + money(pre) + '</span>';
      if(suyo) h += '<span class="suyoTag">su precio</span>';
    } else { h += '<span class="nop">Precio por confirmar</span>'; }
    if(TIENDA_ID && soyDelEquipo())
      h += '<button class="lapiz" data-pe="' + p.i + '" title="Cambiar el precio de esta tienda">&#9998;</button>';
    h += '</div>';
    h += '</div>';
    h += '<div class="cell stp">';
    if(n > 0){
      h += '<button class="b" data-m="' + p.i + '">&minus;</button>';
      h += '<span class="qty" id="q' + p.i + '">' + n + '</span>';
    }
    h += '<button class="b add" data-a="' + p.i + '">+</button>';
    h += '</div></div>';
  }
  if(!out.length) h = '<div class="empty">No encontr&eacute; nada con eso.<br>Prueba con menos letras.</div>';
  else if(out.length > lim) h += '<div class="empty">Hay ' + (out.length-lim) + ' m&aacute;s. Usa el buscador para acotar.</div>';
  document.getElementById('grid').innerHTML = h;
}

/* ---- La camara del telefono como escaner (Manuel y Helen, 26/oct/2026) ----
   Para no tener que comprar escaneres. El lector se baja SOLO cuando se
   aprieta el boton: los telefonos viejos que nunca lo usan no cargan nada.
   Lo que lee se pone en el buscador, igual que si lo hubiera escrito el
   escaner, y la busqueda por codigo de barras hace lo demas. */
var CAM = null;
function camMsg(t){ document.getElementById('camMsg').innerHTML = t; }
function camLib(ok, falla){
  if(window.Html5Qrcode){ ok(); return; }
  var sc = document.createElement('script');
  sc.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
  sc.onload = ok; sc.onerror = falla;
  document.getElementsByTagName('head')[0].appendChild(sc);
}
function camCierra(){
  document.getElementById('cam').className = 'cam';
  if(!CAM) return;
  var c = CAM; CAM = null;
  try { c.stop().then(function(){ try { c.clear(); } catch(e){} }, function(){}); } catch(e){}
}
function camLeyo(txt){
  if(!CAM) return;
  camCierra();
  try { if(navigator.vibrate) navigator.vibrate(120); } catch(e){}
  qEl.value = txt;
  onQ();
  try { qEl.select(); } catch(e){}
  window.scrollTo(0, 0);
}
function camAbre(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    aviso('Este tel&eacute;fono no deja usar la c&aacute;mara desde el navegador. Escribe el nombre del producto.');
    return;
  }
  document.getElementById('cam').className = 'cam on';
  camMsg('Prendiendo la c&aacute;mara&hellip;');
  camLib(function(){
    try {
      var F = window.Html5QrcodeSupportedFormats;
      CAM = new window.Html5Qrcode('camVista', {
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
      CAM.start({ facingMode: 'environment' },
        { fps: 12, qrbox: function(w, h){ return { width: Math.floor(w * 0.88), height: Math.floor(Math.min(w, h) * 0.42) }; } },
        camLeyo, function(){})
        .then(function(){ camMsg('Apunta al c&oacute;digo de barras'); },
              function(){ CAM = null;
                camMsg('No pude prender la c&aacute;mara.<br><small>Dale permiso a la c&aacute;mara para esta p&aacute;gina y vuelve a intentar.</small>'); });
    } catch(e){
      CAM = null;
      camMsg('No pude prender la c&aacute;mara en este tel&eacute;fono.');
    }
  }, function(){
    camMsg('No se pudo cargar el lector.<br><small>Revisa el internet y vuelve a intentar.</small>');
  });
}

/* ---- Vendedor y ruta (Manuel y Helen, 26/oct/2026) ----
   Como en QuickBooks: cada invoice lleva la ruta y el vendedor. Las rutas
   son la lista de valores que ya se usan en los invoices de QuickBooks
   (gd_qb_valores); el vendedor escoge la suya y pone su nombre una vez:
   el telefono se acuerda. Si la lista todavia no esta, se escribe a mano. */
function vrVal(id){
  var el = document.getElementById(id);
  return el ? el.value.replace(/^\s+|\s+$/g, '') : '';
}
function vrGuarda(){
  try { localStorage.setItem('gd_ruta', vrVal('ruta')); localStorage.setItem('gd_vend', vrVal('vendedor')); } catch(e){}
  vrMarca();
}
function vrMarca(){
  document.getElementById('ruta').className = vrVal('ruta') ? '' : 'falta';
  document.getElementById('vendedor').className = vrVal('vendedor') ? '' : 'falta';
}
function vrLista(){
  var x = new XMLHttpRequest();
  x.open('GET', SB_URL + '/gd_qb_valores?select=valor,rol,veces,campo_id&rol=in.(ruta,vendedor)&order=veces.desc&limit=500', true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
  x.onreadystatechange = function(){
    if(x.readyState !== 4 || x.status < 200 || x.status >= 300) return;
    var d = []; try { d = JSON.parse(x.responseText) || []; } catch(e){ return; }
    var rutas = [], vends = '', i, ya = {}, manual = false;
    /* Si Manuel dio sus rutas a mano, esas son las unicas que se escogen. */
    for(i=0;i<d.length;i++) if(d[i].rol === 'ruta' && d[i].campo_id === 'manual') manual = true;
    for(i=0;i<d.length;i++){
      if(manual && d[i].rol === 'ruta' && d[i].campo_id !== 'manual') continue;
      var v = String(d[i].valor);
      if(d[i].rol === 'ruta' && !ya['r' + v]){ ya['r' + v] = 1; rutas.push(v); }
      if(d[i].rol === 'vendedor' && !ya['v' + v]){ ya['v' + v] = 1; vends += '<option value="' + v.replace(/"/g,'&quot;') + '">'; }
    }
    document.getElementById('vendedores').innerHTML = vends;
    if(!rutas.length){
      /* Todavia no se trae la lista de QuickBooks: la ruta se escribe a mano. */
      var viejo = document.getElementById('ruta'), inp = document.createElement('input');
      inp.id = 'ruta'; inp.placeholder = 'Ruta'; inp.setAttribute('autocomplete', 'off');
      inp.value = viejo.value;
      viejo.parentNode.replaceChild(inp, viejo);
      inp.onchange = vrGuarda; inp.onkeyup = vrGuarda;
      vrMarca();
      return;
    }
    rutas.sort();
    var sel = document.getElementById('ruta'), h = '<option value="">Ruta&hellip;</option>', guardada = '';
    try { guardada = localStorage.getItem('gd_ruta') || ''; } catch(e){}
    for(i=0;i<rutas.length;i++){
      var r = rutas[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
      h += '<option value="' + r + '"' + (rutas[i] === guardada ? ' selected' : '') + '>' + r + '</option>';
    }
    sel.innerHTML = h;
    vrMarca();
  };
  try { x.send(null); } catch(e){}
}
